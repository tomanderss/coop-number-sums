<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Number Games" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Coop Number Games — Zahlenrätsel (Number Sums, Math Cross) solo oder im Coop-Modus" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
  <!-- Spieleigene Brett-Optik: Number Sums steckt in styles.css, jedes weitere
       Spiel bringt eine Ebene darüber mit (css/games/<id>.css). Die Wahl liegt
       geräteweit in localStorage (cns_game, s. storage.js) — synchron hier im
       Kopf eingehängt, damit schon das erste Zeichnen stimmt. Ein Spielwechsel
       lädt die App neu. Unbekannte/fehlende Wahl → nichts (= Number Sums). -->
  <script>
    // Native-App-Gefühl: iOS-Safari ignoriert user-scalable=no — Zwei-Finger-
    // Zoom und Doppeltipp-Zoom hier abfangen (touch-action in styles.css deckt
    // die übrigen Browser ab). Spiel-Gesten nutzen Pointer-Events, nicht diese.
    (function () {
      var stop = function (e) { e.preventDefault(); };
      document.addEventListener('gesturestart', stop, { passive: false });
      document.addEventListener('gesturechange', stop, { passive: false });
      document.addEventListener('dblclick', stop, { passive: false });
    })();
  </script>
  <script>
    (function () {
      try {
        // Einstieg per Link (?game=mathcross, z.B. vom Umzugs-Hinweis der alten
        // Math-Cross-App): die Wahl übernehmen und den Parameter aus der Adresse
        // nehmen, damit ein späterer Neustart nicht erneut umschaltet.
        // Bekannte Spiele (muss zu GAME_IDS in js/games/registry.js passen; ein
        // Unit-Test hält beide Listen gleich).
        var GAMES = ['numbersums', 'mathcross', 'rectangles', 'numberpath', 'gems', 'pipes'];
        var m = /[?&]game=([a-z]+)(?:&|$)/.exec(location.search);
        if (m && GAMES.indexOf(m[1]) < 0) m = null;
        if (m) {
          localStorage.setItem('cns_game', JSON.stringify(m[1]));
          // Ein Link auf ein Spiel öffnet DIESES Spiel, nicht den Standard „Mix".
          localStorage.setItem('cns_mix_on', 'false');
          history.replaceState(null, '', location.pathname + location.hash);
        }
        var g = JSON.parse(localStorage.getItem('cns_game') || 'null');
        if (GAMES.indexOf(g) < 0) g = 'numbersums';
        if (g !== 'numbersums') {
          var l = document.createElement('link');
          l.id = 'game-css'; l.rel = 'stylesheet'; l.href = './css/games/' + g + '.css';
          document.head.appendChild(l);
        }
        document.documentElement.setAttribute('data-game', g);
      } catch (e) { /* ohne localStorage: Standardspiel */ }
    })();
  </script>

  <title>Coop Number Games</title>
  <style>
    #splash {
      position: fixed; inset: 0; background: #0b1020;
      display: flex; align-items: center; justify-content: center; z-index: 99997;
      transition: opacity .45s ease; padding-top: env(safe-area-inset-top, 0px);
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }
    #splash-inner { text-align: center; }
    #splash-logo {
      width: 104px; height: 104px; border-radius: 26px; margin: 0 auto;
      display: block; box-shadow: 0 0 48px rgba(91,140,255,.45);
    }
    #splash-title { font-family: system-ui, sans-serif; font-size: 1.4rem; font-weight: 900; color: #e8edf7; margin-top: 18px; letter-spacing: -.3px; }
    #splash-sub { font-family: system-ui, sans-serif; font-size: .8rem; color: #5d6987; margin-top: 4px; }
    #splash-version { font-family: system-ui, sans-serif; font-size: .72rem; color: #3a4564; margin-top: 12px; }
  </style>
</head>
<body>
  <div id="rotate-fix">
    <div id="splash">
      <div id="splash-inner">
        <img id="splash-logo" src="./icons/icon-192.png" alt="" />
        <div id="splash-title">Coop Number Games</div>
        <!-- Splash zeigt das Logo des zuletzt gewählten Spiels (s. data-game im Kopf). -->
        <script>
          (function () { var g = document.documentElement.getAttribute('data-game'); if (g && g !== 'numbersums') document.getElementById('splash-logo').src = './icons/games/' + g + '-192.png'; })();
        </script>
        <div id="splash-version"></div>
      </div>
    </div>
    <div id="app"></div>
    <div id="err" style="display:none;position:fixed;inset:0;background:#1a0000;color:#ff6b6b;padding:20px;font-family:monospace;font-size:13px;z-index:99999;overflow:auto;white-space:pre-wrap"></div>
  </div>
  <script>
    // Klassisches Script (kein type="module") — kann debuglog.js nicht importieren.
    // Schreibt deshalb direkt im selben Format/Key wie debuglog.js, damit ein
    // späterer exportLogToFile()-Aufruf auch Boot-Fehler und globale Laufzeitfehler
    // enthält.
    function cnsLogWindowError(message, extra) {
      try {
        var key = 'cns_debuglog';
        var entries = JSON.parse(localStorage.getItem(key)) || [];
        entries.push({ ts: Date.now(), category: 'window', message: message, extra: extra });
        while (entries.length > 400) entries.shift();
        localStorage.setItem(key, JSON.stringify(entries));
      } catch (e) {}
    }
    // „ResizeObserver loop completed with undelivered notifications" ist KEIN
    // Fehler: der Browser meldet damit nur, dass er Größen-Benachrichtigungen auf
    // den nächsten Frame verschoben hat. Nichts ist kaputt, nichts geht verloren.
    // Der Bildschirm hier ist für FATALE Boot-/Laufzeitfehler gedacht — diese
    // Warnung legte stattdessen mitten im Spiel die ganze App unter einer roten
    // Fläche begraben (in Coop Math Cross gemeldet; derselbe Handler steckte
    // hier). Sie wird protokolliert, aber nicht angezeigt.
    function cnsIsBenign(msg) {
      return typeof msg === 'string' && msg.indexOf('ResizeObserver loop') !== -1;
    }
    window.onerror = function(msg, src, line, col, err) {
      if (cnsIsBenign(msg)) { cnsLogWindowError(String(msg)); return; }
      var d = document.getElementById('err');
      d.style.display = 'block';
      d.textContent = 'ERROR:\n' + msg + '\n\nFile: ' + src + '\nLine: ' + line + '\n\n' + (err && err.stack ? err.stack : '');
      cnsLogWindowError(msg + ' (' + src + ':' + line + ')', err ? { message: err.message, name: err.name } : undefined);
    };
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.getElementById('err');
      d.style.display = 'block';
      d.textContent += '\nPromise Error:\n' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason));
      cnsLogWindowError('Promise Error: ' + String(e.reason), e.reason ? { message: e.reason.message, name: e.reason.name } : undefined);
    });
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
