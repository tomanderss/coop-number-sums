name: Tests

# ── Auf Wanduhrzeit getrimmt (Nutzerwunsch: „CI muss maximal schneller werden") ──
# Gemessen am Lauf von PR #714 (9 min bis grün):
#   Chromium + Systempakete installieren   5:00   ← Browser-Cache traf NIE (s.u.)
#   Tests je Shard (3 Shards, 2 Worker)    3:30–4:00
#   Checkout, npm ci, Post-Steps           0:15
# Deshalb:
#   • E2E im offiziellen Playwright-Container: Browser + Systempakete sind
#     vorinstalliert, die 5 min Installation entfallen komplett. (Der frühere
#     actions/cache-Ansatz half nicht: GitHub gibt Caches nur an denselben Branch
#     oder den Standard-Branch weiter, und auf master läuft dieser Workflow nicht.)
#   • 4 Worker je Maschine statt 2 (alle Kerne; lokal gemessen 5,8 statt 10,9 min
#     für die ganze Suite, 0 wackelige Tests) und 8 Shards statt 3.
#   • Das Repo ist öffentlich — Actions-Minuten kosten nichts, mehr parallele
#     Maschinen sind also frei.
# Erwartet: ~2 min bis grün statt ~9.

on:
  # Der frühere zweite Trigger `push: branches: [master]` ist entfallen: er fuhr
  # nach dem Squash-Merge dieselbe Suite auf demselben Baum, der als PR gerade
  # grün war — jeder Merge kostete dadurch doppelt und dauerte doppelt so lange
  # bis zum fertigen Merge. Wir mergen strikt seriell und immer erst nach grünem
  # PR-Lauf, der Nachlauf brachte also keine neue Aussage.
  pull_request:
    # Reine Text-/Release-Änderungen brauchen keinen Testlauf. `paths-ignore`
    # greift nur, wenn ALLE geänderten Dateien hier gelistet sind — ein PR mit
    # Code fährt also weiterhin die volle Suite.
    # sw.js steht BEWUSST NICHT hier, obwohl `node build.js` es bei jedem Release
    # anfasst: ein Unit-Test prüft, dass jedes js/-Modul in der Asset-Liste des
    # Service Workers steht, und diese Prüfung darf nie ausfallen (ein
    # unvollständiger Precache sperrt Nutzer offline aus).
    paths-ignore:
      - '**.md'
      - 'changes.txt'
      - 'version-*.txt'
      - '.release-counter'
      - 'js/buildinfo.js'
      - '.gitignore'
      - 'LICENSE'

# Ein neuer Push auf denselben PR macht den laufenden Test überflüssig — vorher
# liefen beide bis zum Ende durch und wurden beide bezahlt. Das war der größte
# einzelne Kostenposten, weil ein PR im Schnitt mehrere Korrektur-Pushes bekommt.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Schnelles Signal: die Unit-Tests sind nach ~1 min durch und melden Logikfehler,
  # ohne auf die E2E-Suite zu warten. Kein Browser nötig.
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # Offizielles Playwright-Image: Chromium UND alle Systempakete sind schon
    # drin. Vorher kostete die Installation 5 min je Shard, weil der Browser-
    # Cache praktisch nie traf (GitHub gibt Caches nur an denselben Branch oder
    # den Standard-Branch weiter, und auf master laeuft dieser Workflow nicht).
    # Der Tag MUSS zur @playwright/test-Version in package.json passen —
    # test/unit/ci.test.js erzwingt das.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      # 4 Worker je Maschine (playwright.config.js, CI=true) x 8 Maschinen.
      - run: npx playwright test --shard=${{ matrix.shard }}/8
        timeout-minutes: 8
